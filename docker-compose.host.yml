# Host-specific override for /opt/MailFlow on novosib. Always load it together
# with docker-compose.ghcr.yml — preferably via ./mf.sh, or set COMPOSE_FILE in
# .env. Plain `docker compose` uses docker-compose.yml (source build) instead.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    logging: *default-logging
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379

  frontend:
    logging: *default-logging
    networks:
      - mailflow
      - npm-net

  postgres:
    logging: *default-logging
    volumes:
      - /opt/MailFlow/data/postgres:/var/lib/postgresql/data

  redis:
    logging: *default-logging
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - /opt/MailFlow/data/redis:/data

networks:
  npm-net:
    external: true
